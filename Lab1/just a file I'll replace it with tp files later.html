<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Lab 1 — Placeholder</title>
		<style>
			:root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#22d3ee; }
			html, body { height: 100%; }
			body {
				margin: 0;
				font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell,
					"Noto Sans", "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji",
					"Segoe UI Symbol", sans-serif;
				background: var(--bg);
				color: var(--fg);
				display: grid;
				place-items: center;
			}
			main { text-align: center; padding: 2rem; }
			h1 { margin: 0 0 .5rem; font-size: clamp(1.6rem, 2.2vw + 1rem, 2.4rem); }
			p { margin: .25rem 0; color: var(--muted); }
			.badge {
				display: inline-block;
				margin-top: 1rem;
				border: 1px solid rgba(34, 211, 238, .6);
				color: var(--accent);
				padding: .35rem .6rem;
				border-radius: .5rem;
				font-size: .9rem;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Lab 1 Placeholder</h1>
			<p>You can replace this file with your TP files later.</p>
			<p class="badge">Created on 2025-10-18</p>
